name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install JavaScript dependencies and build assets
        run: |
          yarn install --frozen-lockfile
          npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.2"
          extensions: simplexml, mysql
          tools: phpunit:7.5.15

      - name: Install PHP dependencies
        run: composer install --ignore-platform-reqs --prefer-dist --no-progress --no-suggest --no-dev

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:${{ job.services.mysql.ports['3306'] }} 5.2.2
